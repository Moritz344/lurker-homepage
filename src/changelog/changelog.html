<app-topbar></app-topbar>

<div class="container">
  <div class="grid">
    <h1 style="display:flex;justify-content:center;font-size: 55px;margin-bottom:0px">Last {{ commitData.length }} commits</h1>
    @for (change of commitData; track $index) {
      <app-changelog-item [data]="change"></app-changelog-item>
    }
  </div>
</div>
